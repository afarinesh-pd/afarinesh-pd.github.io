<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل شخصی زبان‌آموز | آموزشگاه آفرینش</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .panel-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .user-header {
            background: linear-gradient(135deg, #1d1d1f, #2d2d30);
            color: white; padding: 25px 30px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .info-card {
            background: white; border-radius: 12px; padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        .info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px; margin-top: 15px; font-size: 14px; line-height: 1.8;
        }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-light-section">

    <div class="panel-container">
        <!-- هدر پنل شخصی -->
        <div class="user-header" style="display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;">
            <div>
                <h2 id="studentWelcomeTitle" style="font-size: 18px;">خوش آمدید، زبان‌آموز عزیز</h2>
                <p style="font-size: 12px; color: #aeaeaf; margin-top: 5px;">پنل اختصاصی پیگیری دوره‌ها و سوابق آموزشی</p>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="renewTerm()" class="btn" style="background-color: #e74c3c; color: white;">
                    🔄 تمدید ترم کلاس زبان
                </button>
                <button id="userLogoutBtn" class="btn" style="background: #ff3b30; color: white;">خروج از پنل</button>
            </div>
        </div>

        <!-- کارت اطلاعات شخصی -->
        <div class="info-card">
            <h3 style="color: var(--primary, #e61c23); border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px;">👤 اطلاعات پرونده شخصی</h3>
            <div id="studentProfileDetails" class="info-grid">
                <!-- توسط جاوااسکریپت پر می‌شود -->
            </div>
        </div>
        <!-- کارت نمرات آزمون‌های کلاسی -->
        <div class="info-card">
            <h3 style="color: #27ae60; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px;">📊 نمرات آزمون‌های کلاسی</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ردیف</th>
                            <th>نام آزمون</th>
                            <th>نمره کسب شده</th>
                            <th>تاریخ ثبت نمره</th>
                        </tr>
                    </thead>
                    <tbody id="studentGradesTable">

                    </tbody>
                </table>
            </div>
        </div>
        <!-- کارت سوابق ثبت‌نام و کلاس‌ها -->
        <div class="info-card">
            <h3 style="color: #0071e3; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px;">📚 سوابق دوره‌ها و ثبت‌نامی‌ها</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ردیف</th>
                            <th>دوره / رده سنی</th>
                            <th>شهریه پرداختی</th>
                            <th>تاریخ ثبت‌نام اولیه</th>
                            <th>تاریخ تأیید نهایی</th>
                            <th>وضعیت حساب</th>
                        </tr>
                    </thead>
                    <tbody id="studentHistoryTable">
                        <!-- توسط جاوااسکریپت پر می‌شود -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
</body>
</html>
